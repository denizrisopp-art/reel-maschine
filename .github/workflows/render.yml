name: Reel rendern
on:
  workflow_dispatch:
    inputs:
      daten:
        description: 'Reel-Daten als JSON (kommt von n8n)'
        required: true
      tag:
        description: 'Eindeutiger Name für das fertige Video'
        required: true
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Schriften bereitstellen
        run: mkdir -p public/fonts && cp node_modules/@fontsource/inter/files/inter-latin-{500,600,700,800,900}-normal.woff2 node_modules/@fontsource/inter/files/inter-latin-ext-{500,600,700,800,900}-normal.woff2 public/fonts/
      - name: Reel bauen
        env:
          DATEN: ${{ inputs.daten }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: node scripts/render.mjs
      - name: Video ins Projekt legen (für den Abruf über jsDelivr)
        run: |
          git config user.name "reel-maschine"
          git config user.email "reel-maschine@users.noreply.github.com"
          mkdir -p videos
          cp out/reel.mp4 "videos/${{ inputs.tag }}.mp4"
          git add "videos/${{ inputs.tag }}.mp4"
          git commit -m "Reel ${{ inputs.tag }}"
          git push
      - name: Video veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ inputs.tag }}" out/reel.mp4 --title "${{ inputs.tag }}" --notes "Automatisch gerendert" --latest=false
